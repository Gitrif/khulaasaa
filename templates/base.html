<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dispatch{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="{% block body_class %}bg-paper text-ink{% endblock %}">
  <div class="site-nav">
    <a href="/" class="site-nav-link {{ 'active' if request.url.path == '/' }}">News</a>
    <a href="/bids" class="site-nav-link {{ 'active' if request.url.path == '/bids' }}">Bids <span class="premium-dot"></span></a>
    <a href="/jobs" class="site-nav-link {{ 'active' if request.url.path == '/jobs' }}">Jobs</a>
  </div>
  {% block content %}{% endblock %}
</body>
</html>
