[pytest]
filterwarnings =
    ignore:The `name` is not the first parameter anymore:DeprecationWarning:starlette.templating
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    ignore:Setting per-request cookies:DeprecationWarning:starlette.testclient
    ignore:Unverified HTTPS request is being made:urllib3.exceptions.InsecureRequestWarning
    ignore:EDITOR_PASSWORD is still the default:UserWarning:core
