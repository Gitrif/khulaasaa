name: Auth and Identity Regression Tests

on:
  push:
    branches:
      - main
      - fix/auth-registration-and-page-performance
  pull_request:
    branches:
      - main

jobs:
  auth-identity-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KHULAASAA_DB_PATH: ${{ runner.temp }}/khulaasaa-auth-test.db
      EDITOR_USERNAME: editor
      EDITOR_PASSWORD: test-editor-password
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run auth, identity, and Viber regression tests
        run: |
          pytest -q tests/test_auth_identity_security.py tests/test_preferences_and_channel_linking.py tests/test_viber.py
